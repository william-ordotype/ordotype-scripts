<!-- Mon compte : nouvelle présentation et secours. Source : ordotype-scripts, account/compte-head.html
     (copie de référence de ce bloc du code d'en-tête de la page /membership/compte, testée par test/compte-head.js).
     Mon profil, Connexion et sécurité et Facturation s'affichent tout de suite (valeurs et formulaires Memberstack,
     attente et portail de la Facturation) ; un script coupé, absent, en échec ou sans rendu en 8 s est seulement
     mesuré (GA4). Un chargeur absent part aussi dans Sentry. -->
<script>
(function () {
  var h = document.documentElement;
  var debut = Date.now();
  var SUIVIS = [
    { fichier: 'profile-overview.js', classe: 'ordo-profil', rendu: function () { return h.classList.contains('ordo-profil-v2'); } },
    { fichier: 'subscriptions-overview.js', classe: 'ordo-subs', rendu: function () { return h.classList.contains('ordo-subs-v2'); } }
  ];

  function alerter(nom, message) {
    try {
      var err = new Error(message);
      err.name = nom;
      window.dispatchEvent(new ErrorEvent('error', { message: nom + ': ' + message, error: err }));
    } catch (e) {
      if (window.console) console.error('[Mon compte]', nom, message, e);
    }
  }

  function mesurer(payload) {
    try {
      var r = window.OrdoErrorReporter;
      if (r && typeof r.track === 'function') return r.track(payload);
      (window.dataLayer = window.dataLayer || []).push(payload);
    } catch (e) {
      alerter('CompteMesureImpossible', (e && e.message) || 'dataLayer');
    }
  }

  // raison : coupe (décision du chargeur, voulue : ni mesure ni alerte), delai, script, chargeur.
  function secours(s, raison) {
    if (h.classList.contains(s.classe + '-fallback') || s.rendu()) return;
    h.classList.add(s.classe + '-fallback');
    if (raison === 'coupe') return;
    if (s.classe === 'ordo-profil') {
      mesurer({ event: 'profile_action', profile_action: 'view', profile_section: '', profile_outcome: 'fallback-' + raison, profile_step: 'view:-:fallback-' + raison });
    } else if (raison !== 'delai') {
      // Délai de la liste : subscriptions-overview.js le mesure et le signale lui-même.
      mesurer({ event: 'subscriptions_list', subs_outcome: 'fallback-' + raison });
    }
  }

  // Un script de la liste qui ne se télécharge pas : mesuré tout de suite (le chargeur le signale à Sentry).
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (!t || t.tagName !== 'SCRIPT') return;
    var src = t.src || '';
    for (var i = 0; i < SUIVIS.length; i++) {
      if (src.indexOf('/account/' + SUIVIS[i].fichier) !== -1) secours(SUIVIS[i], 'script');
    }
  }, true);

  // Le chargeur est « defer » : à DOMContentLoaded, il a tourné, ou il ne tournera pas (échec de
  // téléchargement compris). Personne d'autre ne peut signaler son absence.
  document.addEventListener('DOMContentLoaded', function () {
    var present = true;
    try { present = !!window.OrdoRollout; } catch (e) { /* illisible : on attend les 8 s */ }
    if (present) return;
    for (var i = 0; i < SUIVIS.length; i++) secours(SUIVIS[i], 'chargeur');
    alerter('CompteChargeurAbsent', 'account/loader.js absent : page sans ses scripts');
  });

  (function verifier() {
    var restants = 0;
    for (var i = 0; i < SUIVIS.length; i++) {
      var s = SUIVIS[i];
      if (h.classList.contains(s.classe + '-fallback') || s.rendu()) continue;
      var d = null;
      try { d = window.OrdoRollout && window.OrdoRollout[s.fichier]; } catch (e) { /* décision illisible : on attend les 8 s */ }
      if (d && d.enabled === false) secours(s, 'coupe');
      else if (Date.now() - debut >= 8000) secours(s, 'delai');
      else restants += 1;
    }
    if (restants) setTimeout(verifier, 100);
  })();
})();
</script>
<style>
/* Mon profil et Connexion et sécurité s'affichent sans attendre le script : leurs valeurs sont écrites par
   Memberstack (data-ms-member) et leurs formulaires sont ceux de Memberstack. Seul l'en-tête de Mon profil, calculé
   par le script (initiales, « Dr », résumé, RPPS), reste invisible jusqu'à son passage. */
html:not(.ordo-profil-v2) [data-ordo-v2="profil"] [data-ordo-initiales],
html:not(.ordo-profil-v2) [data-ordo-v2="profil"] [data-ordo-nom-complet],
html:not(.ordo-profil-v2) [data-ordo-v2="profil"] [data-ordo-resume],
html:not(.ordo-profil-v2) [data-ordo-v2="profil"] [data-ordo-rpps-entete] { visibility: hidden; }
/* Encart visible seulement dans le Designer. */
.compte-v2_designer { display: none !important; }
/* Facturation : « Mes abonnements » (texte d'attente et lien Memberstack vers le portail Stripe) et l'aide
   s'affichent tout de suite. Les exemples dessinés dans le Designer ne s'affichent jamais ; la liste (vide sans
   son exemple) et les cartes qui n'ont de sens qu'avec des données (moyen de paiement, adresse, factures)
   attendent le script, qui les montre ou non. */
[data-ordo-facturation] [data-ordo-gabarit] { display: none !important; }
html:not(.ordo-subs-v2) [data-ordo-facturation] [data-ordo-liste],
html:not(.ordo-subs-v2) [data-ordo-facturation] [data-ordo-section]:not([data-ordo-section="abonnements"]) { display: none; }
/* Carte SIREN de la Facturation : profile-overview.js l'affiche quand le finder SIREN peut y aller (finder chargé
   dans sa présentation du Designer, membre non interne). Sans lui, jamais de carte vide. */
html:not(.ordo-siren-facturation) [data-ordo-siren-carte="facturation"] { display: none !important; }
/* Ce que le Designer ne sait pas dessiner : pulsation des squelettes, bouton occupé. */
@keyframes compte-v2-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.compte-v2_squelette, .compte-v2_interrupteur.is-chargement { animation: compte-v2-pulse 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .compte-v2_squelette, .compte-v2_interrupteur.is-chargement { animation: none; } }
[data-ordo-facturation] button[disabled], [data-ordo-facturation] input[type="submit"][disabled] { opacity: .5; cursor: default; }
/* Recherches RPPS et SIREN dessinées dans le Designer : bouton occupé (le Designer n'a pas d'état « désactivé »). */
.compte-v2_finder button[disabled] { opacity: .5; cursor: default; }
/* Double authentification dessinée dans le Designer (module d'authentification) : bouton occupé. */
#ordotype-totp-section button[disabled] { opacity: .5; cursor: not-allowed; }
/* Photo de profil dessinée dans le Designer : pastille, liens et message cachés tant que son script ne l'a pas activée. */
html:not(.ordo-photo-v2) [data-ordo-photo]:not([data-ordo-photo="declencheur"]) { display: none !important; }
html:not(.ordo-photo-v2) .compte-v2_photo { cursor: auto; }
/* Ce que le Designer ne sait pas dessiner : cercle qui tourne pendant l'envoi de la photo. */
@keyframes compte-v2-tourne { to { transform: rotate(360deg); } }
.compte-v2_photo-chargement { animation: compte-v2-tourne 1s linear infinite; }
@media (prefers-reduced-motion: reduce) { .compte-v2_photo-chargement { animation: none; } }
</style>
